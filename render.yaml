services:
  - type: web
    name: voiceshield-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend-requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: MODEL_ID
        value: MelodyMachine/Deepfake-audio-detection-V2
      - key: ANALYSIS_ENABLED
        value: "false"
